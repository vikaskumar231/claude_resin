services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: artaalay, POSTGRES_PASSWORD: artaalay, POSTGRES_DB: artaalay }
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data", "./backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro"]
  api:
    build: ./backend
    env_file: ./backend/.env
    depends_on: [db]
    ports: ["8000:8000"]
  web:
    build: ./frontend
    depends_on: [api]
    ports: ["3000:3000"]
volumes: { pgdata: {} }
